name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: NuGet Restore
        run: nuget restore AssetStudio.sln

      - name: Run core regression tests
        run: dotnet test AssetStudio.Tests/AssetStudio.Tests.csproj --configuration Release

      - name: Build GUI .NET 7
        run: msbuild AssetStudio.sln /t:AssetStudio_GUI:publish /p:Configuration=Release /p:TargetFramework=net7.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build GUI .NET 8
        run: msbuild AssetStudio.sln /t:AssetStudio_GUI:publish /p:Configuration=Release /p:TargetFramework=net8.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build CLI .NET 7
        run: msbuild AssetStudio.sln /t:AssetStudio_CLI:publish /p:Configuration=Release /p:TargetFramework=net7.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build CLI .NET 8
        run: msbuild AssetStudio.sln /t:AssetStudio_CLI:publish /p:Configuration=Release /p:TargetFramework=net8.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Upload GUI .NET 7
        uses: actions/upload-artifact@v4
        with:
          name: studio-gui-net7-${{ github.sha }}
          path: AssetStudio.GUI/bin/Release/net7.0-windows/publish
          if-no-files-found: error

      - name: Upload GUI .NET 8
        uses: actions/upload-artifact@v4
        with:
          name: studio-gui-net8-${{ github.sha }}
          path: AssetStudio.GUI/bin/Release/net8.0-windows/publish
          if-no-files-found: error

      - name: Upload CLI .NET 7
        uses: actions/upload-artifact@v4
        with:
          name: studio-cli-net7-${{ github.sha }}
          path: AssetStudio.CLI/bin/Release/net7.0-windows/publish
          if-no-files-found: error

      - name: Upload CLI .NET 8
        uses: actions/upload-artifact@v4
        with:
          name: studio-cli-net8-${{ github.sha }}
          path: AssetStudio.CLI/bin/Release/net8.0-windows/publish
          if-no-files-found: error
